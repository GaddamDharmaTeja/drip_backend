server.port=8080

spring.application.name=dripgrow-api

# Prefer MONGODB_URI env var, then application-local.properties (profile=local), else localhost
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dripgrow}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Seed catalog / sample admin data when empty
dripgrow.seed.enabled=true

# Admin bootstrap (override in application-local.properties)
dripgrow.admin.username=${ADMIN_USERNAME:admin}
dripgrow.admin.password=${ADMIN_PASSWORD:Admin@123}
dripgrow.jwt.secret=${JWT_SECRET:dripgrow-dev-secret-change-me-to-a-long-random-string-32+}
dripgrow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS for storefront (5173) + admin app (5174)
dripgrow.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

# Image uploads (GridFS bucket: uploads → uploads.files / uploads.chunks)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
